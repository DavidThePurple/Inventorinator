name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, matching pubspec.yaml (for example v0.1.0-alpha)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.1
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Require tag to match the application version
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test "$RELEASE_TAG" = "v$app_version"
          ./tool/check_release_consistency.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  supabase:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package and verify the version-specific Supabase schema
        run: |
          schema_version="$(find supabase/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | tail -n 1 | sed 's/^0*\([0-9][0-9]*\)_.*/\1/')"
          test -n "$schema_version"
          package_name="Inventorinator-${RELEASE_TAG}-Supabase-schema${schema_version}"
          package_dir="dist/$package_name"
          install -d "$package_dir/connector" "$package_dir/migrations"
          install -m 644 supabase/README.md supabase/docker-compose.inventorinator.yml "$package_dir/"
          install -m 755 supabase/install-or-update.sh supabase/apply-migrations.sh "$package_dir/"
          install -m 644 supabase/connector/Dockerfile supabase/connector/server.py "$package_dir/connector/"
          install -m 755 supabase/connector/entrypoint.sh "$package_dir/connector/"
          install -m 644 supabase/migrations/*.sql "$package_dir/migrations/"
          archive="dist/$package_name.tar.gz"
          tar -C dist -czf "$archive" "$package_name"
          verify_dir="$(mktemp -d)"
          tar -C "$verify_dir" -xzf "$archive"
          test -x "$verify_dir/$package_name/install-or-update.sh"
          test -x "$verify_dir/$package_name/connector/entrypoint.sh"
          test "$(find "$verify_dir/$package_name/migrations" -maxdepth 1 -name '*.sql' | wc -l)" -eq "$schema_version"
          ! find "$verify_dir/$package_name" -type f \( -name '*.pyc' -o -name '*secret*' -o -name '*.env' \) | grep .
          rm -rf "$verify_dir" "$package_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: release-supabase
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: validate
    # Keep the portable Linux bundle compatible with Ubuntu 22.04-era glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev tesseract-ocr
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux
        run: |
          package_dir="dist/Inventorinator"
          mkdir -p "$package_dir"
          cp -a build/linux/x64/release/bundle/. "$package_dir/"
          install -m 755 linux/packaging/install.sh "$package_dir/install.sh"
          install -m 644 \
            linux/packaging/media.everlasting.inventorinator.desktop \
            "$package_dir/Inventorinator.desktop"
          install -m 644 README.md LICENSE CHANGELOG.md "$package_dir/"
          test -s "$package_dir/data/app_icon.png"
          test -s "$package_dir/Inventorinator.desktop"
          test -s "$package_dir/LICENSE"
          test -s "$package_dir/share/icons/hicolor/512x512/apps/media.everlasting.inventorinator.png"
          test -s "$package_dir/share/applications/media.everlasting.inventorinator.desktop"
          test -x "$package_dir/Inventorinator"
          test -x "$package_dir/install.sh"
          app_build="$(sed -n 's/^version: [^+]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)"
          test -n "$app_build"
          archive="Inventorinator-${RELEASE_TAG}-build${app_build}-Linux-x64.tar.gz"
          tar -C dist -czf "dist/$archive" Inventorinator
          verify_dir="$(mktemp -d)"
          tar -C "$verify_dir" -xzf "dist/$archive"
          test -x "$verify_dir/Inventorinator/Inventorinator"
          test -x "$verify_dir/Inventorinator/install.sh"
          rm -rf "$verify_dir"
          rm -rf "$package_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure Android release signing
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/inventorinator-upload.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=../inventorinator-upload.jks" \
            > android/key.properties
      - run: flutter pub get
      - run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Name Android packages
        run: |
          mkdir -p dist
          app_build="$(sed -n 's/^version: [^+]*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)"
          test -n "$app_build"
          package_version="${RELEASE_TAG}-build${app_build}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Inventorinator-${package_version}-Android-universal.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/Inventorinator-${package_version}-Android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Inventorinator-${package_version}-Android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/Inventorinator-${package_version}-Android-x86_64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s+[^+]+\+(\d+)\s*$'
          if (-not $versionLine) { throw "Missing application build number" }
          $appBuild = $versionLine.Matches[0].Groups[1].Value
          $packageDir = "dist\Inventorinator"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Recurse "build\windows\x64\runner\Release\*" $packageDir
          Copy-Item README.md, LICENSE, CHANGELOG.md $packageDir
          if (-not (Test-Path "$packageDir\Inventorinator.exe")) { throw "Missing Windows executable" }
          if (-not (Test-Path "$packageDir\LICENSE")) { throw "Missing license" }
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\Inventorinator-$env:RELEASE_TAG-build$appBuild-Windows-x64.zip"
          Remove-Item -Recurse -Force $packageDir
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [linux, android, windows, supabase]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${RELEASE_TAG}.md"
          test -s "$notes_file"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Inventorinator $RELEASE_TAG" \
              --notes-file "$notes_file" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Inventorinator $RELEASE_TAG" \
              --prerelease \
              --notes-file "$notes_file"
          fi
