name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: audit
    steps:
      - uses: actions/checkout@v4
      - name: Verify release and schema versions
        run: ./tool/check_release_consistency.sh
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply every migration
        env:
          INVENTORINATOR_DB_URL: postgresql://postgres:audit@127.0.0.1:5432/postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          ./supabase/install-or-update.sh --hosted
          ./supabase/install-or-update.sh --hosted
          test "$(psql -h 127.0.0.1 -U postgres -Atqc 'select version from public.inventorinator_schema where singleton')" = "13"
      - name: Verify builder quantity enforcement
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/builder_quantity_integrity.sql
      - name: Verify role and owner boundaries
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/role_boundaries.sql
      - name: Verify owner recovery
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/owner_recovery.sql
      - name: Verify incremental record sync
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/incremental_entity_sync.sql
      - name: Build connector image
        run: docker build -f supabase/connector/Dockerfile supabase

  linux:
    # Build on the oldest supported Ubuntu baseline so native plugins do not
    # unnecessarily require glibc 2.38 from Ubuntu 24.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Install Linux build and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev tesseract-ocr
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Enforce the coverage floor
        run: ./tool/check_coverage.sh 60
      - run: flutter build linux --release
      - name: Verify bundled native libraries
        run: |
          if ldd build/linux/x64/release/bundle/Inventorinator | grep -q "not found"; then
            ldd build/linux/x64/release/bundle/Inventorinator
            exit 1
          fi
          if ldd assets/ocr/linux_x64/tesseract | grep -q "not found"; then
            ldd assets/ocr/linux_x64/tesseract
            exit 1
          fi
      - name: Exercise native Code 128 decoder
        env:
          INVENTORINATOR_NATIVE_DECODER_TEST: "1"
          LD_LIBRARY_PATH: build/linux/x64/release/bundle/lib
        run: flutter test test/widget_test.dart --plain-name "ingest decoder reads a tilted alphanumeric Code 128 FNSKU"

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Android app lint
        working-directory: android
        run: ./gradlew :app:lintDebug

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
