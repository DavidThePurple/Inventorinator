name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: audit
    steps:
      - uses: actions/checkout@v7
      - name: Verify release and schema versions
        run: ./tool/check_release_consistency.sh
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply every migration
        env:
          INVENTORINATOR_DB_URL: postgresql://postgres:audit@127.0.0.1:5432/postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          ./supabase/install-or-update.sh --hosted
          ./supabase/install-or-update.sh --hosted
          latest_migration=$(find supabase/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' \
            -printf '%f\n' | sort | tail -n 1 | sed 's/^0*\([0-9][0-9]*\)_.*/\1/')
          test "$(psql -h 127.0.0.1 -U postgres -Atqc 'select version from public.inventorinator_schema where singleton')" = "$latest_migration"
      - name: Verify builder quantity enforcement
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/builder_quantity_integrity.sql
      - name: Verify role and owner boundaries
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/role_boundaries.sql
      - name: Verify owner-only role templates
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/role_templates.sql
      - name: Custom role boundaries
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/custom_roles.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/custom_role_build_integrity.sql
      - name: Test DigiKey credential permissions
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/digikey_credentials.sql
      - name: Test Mouser credential permissions
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/mouser_credentials.sql
      - name: Verify owner recovery
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/owner_recovery.sql
      - name: Verify incremental record sync
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/incremental_entity_sync.sql
      - name: Build connector image
        run: docker build -f supabase/connector/Dockerfile supabase
      - name: Package Supabase schema artifact
        run: |
          schema_version="$(find supabase/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | tail -n 1 | sed 's/^0*\([0-9][0-9]*\)_.*/\1/')"
          test -n "$schema_version"
          package_dir="dist/Inventorinator-v$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)-Supabase-schema${schema_version}"
          install -d "$package_dir/connector" "$package_dir/migrations"
          install -m 644 supabase/README.md supabase/docker-compose.inventorinator.yml "$package_dir/"
          install -m 755 supabase/install-or-update.sh supabase/apply-migrations.sh "$package_dir/"
          install -m 644 supabase/connector/Dockerfile supabase/connector/server.py "$package_dir/connector/"
          install -m 755 supabase/connector/entrypoint.sh "$package_dir/connector/"
          install -m 644 supabase/migrations/*.sql "$package_dir/migrations/"
          test "$(find "$package_dir/migrations" -maxdepth 1 -name '*.sql' | wc -l)" -eq "$schema_version"
      - uses: actions/upload-artifact@v7
        with:
          name: inventorinator-supabase-schema
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux:
    # Build on the oldest supported Ubuntu baseline so native plugins do not
    # unnecessarily require glibc 2.38 from Ubuntu 24.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Install Linux build and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev tesseract-ocr
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Enforce the coverage floor
        run: ./tool/check_coverage.sh 60
      - run: flutter build linux --release
      - name: Verify bundled native libraries
        run: |
          if ldd build/linux/x64/release/bundle/Inventorinator | grep -q "not found"; then
            ldd build/linux/x64/release/bundle/Inventorinator
            exit 1
          fi
          if ldd assets/ocr/linux_x64/tesseract | grep -q "not found"; then
            ldd assets/ocr/linux_x64/tesseract
            exit 1
          fi
          test -x build/linux/x64/release/bundle/data/ocr/linux_x64/tesseract
          test -s build/linux/x64/release/bundle/data/ocr/linux_x64/tessdata/eng.traineddata
      - name: Exercise native Code 128 decoder
        env:
          INVENTORINATOR_NATIVE_DECODER_TEST: "1"
          LD_LIBRARY_PATH: build/linux/x64/release/bundle/lib
        run: flutter test test/widget_test.dart --plain-name "ingest decoder reads a tilted alphanumeric Code 128 FNSKU"
      - name: Package desktop integration
        run: |
          bundle_dir="build/linux/x64/release/bundle"
          install -m 755 linux/packaging/install.sh "$bundle_dir/install.sh"
          install -m 644 \
            linux/packaging/media.everlasting.inventorinator.desktop \
            "$bundle_dir/Inventorinator.desktop"
          test -s "$bundle_dir/data/app_icon.png"
          test -s "$bundle_dir/share/icons/hicolor/512x512/apps/media.everlasting.inventorinator.png"
          test -s "$bundle_dir/share/applications/media.everlasting.inventorinator.desktop"
          test -x "$bundle_dir/install.sh"
      - name: Compute artifact name
        id: artifact
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          echo "name=Inventorinator-v${app_version}-Linux-x64" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Configure Android release signing
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/inventorinator-upload.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=../inventorinator-upload.jks" \
            > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Verify Android package contents
        run: |
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            if unzip -l "$apk" | grep -q 'assets/flutter_assets/assets/ocr/linux_x64/'; then
              echo "Linux OCR assets leaked into Android package: $apk" >&2
              exit 1
            fi
          done
      - name: Android app lint
        working-directory: android
        run: ./gradlew :app:lintRelease
      - name: Compute artifact name
        id: artifact
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          echo "name=Inventorinator-v${app_version}-Android-production" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Compute artifact name
        id: artifact
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          echo "name=Inventorinator-v${app_version}-Windows-x64" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build\windows\x64\runner\Release
          if-no-files-found: error
          retention-days: 7
